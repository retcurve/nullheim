<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mosaic</title>
<link rel="stylesheet" href="/enter/style.css">
</head>
<body>
<div id="crt">
  <div id="screen">
    <div id="output"></div>
    <div id="promptline">
      <span id="more-indicator">More</span>
      <span class="prompt">&gt;</span>
      <span id="typed"></span><span id="cursor">&#9608;</span>
    </div>
  </div>
</div>
<div id="map-overlay" class="hidden">
  <div id="map-popup">
    <div id="map-hint">+/&minus; zoom &middot; arrow keys scroll &middot; click a sector to teleport &middot; Esc to close</div>
    <div id="map-viewport">
      <div id="map-grid"></div>
    </div>
  </div>
</div>
<div id="map-tooltip" class="hidden"></div>
<input id="hidden-input" autocomplete="off" autocapitalize="off" spellcheck="false">
<script src="/enter/app.js"></script>
</body>
</html>
