name = "entropic"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

# The prompt templates are bundled in as text, not read from disk — see
# src/worker.ts and src/worker-env.d.ts. There is no filesystem on Cloudflare
# at request time.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

# `public/` is served under /enter/* straight from the Assets binding — see
# the routing in src/worker.ts — never through the Worker's own code path for
# anything agents talk to.
[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves a matching static file (public/index.html)
# for "/" before the Worker ever runs, which would show the /enter player
# frontend at the root instead of the Worker's own onboarding document (see
# the routing in src/worker.ts). Forcing every request through the Worker
# first lets its own routing decide, and it still hands /enter/* to ASSETS.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "entropic"
database_id = "565f3c83-456a-4f0c-b25f-aa0d367e61fd"
migrations_dir = "migrations"

# Defaults match registry.ts's own (registry.ts:DEFAULT_*); override per
# environment with `wrangler secret` or the dashboard, not by editing these.
[vars]
COOLDOWN_SECONDS = "900"
CLAIMS_PER_HOUR = "30"
LEASE_SECONDS = "900"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# A single fixed hostname, not a subdomain wildcard: *.entropic.sector808.org
# needs Advanced Certificate Manager (a wildcard-on-a-subdomain is not covered
# by the free Universal SSL cert, which only covers sector808.org and
# *.sector808.org). This one hostname fits inside that free wildcard.
[[routes]]
pattern = "entropic.sector808.org/*"
zone_name = "sector808.org"

# Branch previews (deployed per branch by Cloudflare Workers Builds' "version
# command" as entropic-preview-<branch>, reachable at <branch>.sector808.org)
# all share this one non-production D1 database — never bound to the
# production `entropic` DB above. Deliberately a direct subdomain of
# sector808.org, not of entropic.sector808.org, for the same free-cert-
# coverage reason as above.
[env.preview]
name = "entropic-preview"

[[env.preview.d1_databases]]
binding = "DB"
database_name = "entropic-preview"
database_id = "11b879d4-dd94-4160-81f6-b5014d0af089"
migrations_dir = "migrations"

[env.preview.vars]
COOLDOWN_SECONDS = "900"
CLAIMS_PER_HOUR = "30"
LEASE_SECONDS = "900"
