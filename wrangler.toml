name = "nullheim"
main = "src/worker.ts"
compatibility_date = "2026-08-01"

# Keeps production dark while the custom route further down is commented out —
# `workers_dev` defaults to true once no `routes` exist, so without this,
# disabling that route would just swap the custom domain for the *.workers.dev
# one instead. It has to live up here among the top-level keys: below the first
# table header TOML would read it as a key of that table (it previously sat
# under [observability.traces], where wrangler ignored it).
workers_dev = false

# The prompt templates are bundled in as text, not read from disk — see
# src/worker.ts and src/worker-env.d.ts. There is no filesystem on Cloudflare
# at request time.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = false

# `public/` is served under /enter/* straight from the Assets binding — see
# the routing in src/worker.ts — never through the Worker's own code path for
# anything agents talk to.
[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves a matching static file (public/index.html)
# for "/" before the Worker ever runs, which would show the /enter player
# frontend at the root instead of the Worker's own onboarding document (see
# the routing in src/worker.ts). Forcing every request through the Worker
# first lets its own routing decide, and it still hands /enter/* to ASSETS.
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "nullheim"
database_id = "9c51fc64-dcd7-4ef5-8892-ca4febe981ec"
migrations_dir = "migrations"

# Agent-uploaded images, already resized and compressed before they land
# here — see src/image-processing.ts and src/images/r2.ts. Zero egress fees
# and a free tier (10GB storage, 1M writes, 10M reads/month) that should
# cover this project indefinitely.
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "nullheim-images"

# Defaults match registry.ts's own (registry.ts:DEFAULT_*); override per
# environment with `wrangler secret` or the dashboard, not by editing these.
[vars]
COOLDOWN_SECONDS = "21600"
CLAIMS_PER_HOUR = "30"
LEASE_SECONDS = "900"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# A single fixed hostname, not a subdomain wildcard: *.nullheim.sector808.org
# needs Advanced Certificate Manager (a wildcard-on-a-subdomain is not covered
# by the free Universal SSL cert, which only covers sector808.org and
# *.sector808.org). This one hostname fits inside that free wildcard.
#
# Disabled for now — reenable by uncommenting this and removing the
# top-level `workers_dev = false` near the top of this file (which exists only
# because, per the preview environment's own comment further down,
# `workers_dev` defaults to true once no `routes` exist — without it, disabling
# this route would just swap the custom domain for the *.workers.dev one
# instead of going dark).
# Needs a `wrangler deploy` (or the next Workers Builds deploy of main) to
# actually take the domain down or back up; editing this file alone changes
# nothing live until deployed.
# [[routes]]
# pattern = "nullheim.sector808.org/*"
# zone_name = "sector808.org"

# Bindings for branch previews, which all share this one non-production D1
# database — never the production `nullheim` DB above.
#
# A preview is a *version* of the production Worker, uploaded by Cloudflare
# Workers Builds' "version command" (`wrangler versions upload --env preview`)
# and left at 0% traffic, reachable only at its own preview URL. It is not a
# Worker of its own: Workers Builds sets WRANGLER_CI_OVERRIDE_NAME to the
# connected Worker and wrangler applies it after `--name`, so `name` below is
# overridden to whatever that dashboard setting says in CI and a per-branch
# Worker cannot be deployed from a build. `wrangler deploy` must therefore
# never run on a branch — it would publish that branch onto production.
#
# `routes` is an inheritable key, so without the empty list here this
# environment would inherit the production route above and any deploy of it
# would take nullheim.sector808.org.
#
# `workers_dev` is also inheritable, and defaults to false once any `routes`
# exist anywhere above unless an environment says otherwise — which is why
# adding the production route silently took the preview URL down too. This
# environment is only ever reachable at its preview URL, so it must say true.
[env.preview]
name = "nullheim-preview"
routes = []
workers_dev = true
preview_urls = true

[[env.preview.d1_databases]]
binding = "DB"
database_name = "nullheim-preview"
database_id = "79a021ed-f7b8-44f3-95eb-58ca95846572"
migrations_dir = "migrations"

# Shares the one production bucket above — branch previews are throwaway,
# and a second bucket buys nothing a prefix wouldn't.
[[env.preview.r2_buckets]]
binding = "IMAGES"
bucket_name = "nullheim-images"

[env.preview.vars]
COOLDOWN_SECONDS = "21600"
CLAIMS_PER_HOUR = "30"
LEASE_SECONDS = "900"
